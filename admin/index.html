<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planora Admin</title><meta name="theme-color" content="#087A5B">
<meta name="application-name" content="Planora Admin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planora Admin">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-rounded,"Segoe UI",sans-serif;background:#f7f8f6;color:#17332b}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.brand{font-size:25px;font-weight:800;color:#087A5B}.muted{color:#6d7c77}.card{background:#fff;border:1px solid #e5ebe7;border-radius:22px;padding:22px;box-shadow:0 8px 30px #1232}.login{max-width:430px;margin:9vh auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #e5ebe7;border-radius:18px;padding:16px}.stat b{font-size:24px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,select,button{font:inherit;border-radius:12px;padding:12px 14px;border:1px solid #d9e3de}input,select{background:#fff;min-width:180px}button{border:0;background:#087A5B;color:white;font-weight:700;cursor:pointer}button.secondary{background:#eef5f2;color:#087A5B}button.danger{background:#fff0f0;color:#b42318}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.table{overflow:auto}.item{display:grid;grid-template-columns:1.4fr 1.2fr .8fr .7fr 1.5fr;gap:10px;align-items:center;padding:14px 4px;border-bottom:1px solid #edf1ef}.code{font-family:ui-monospace,monospace;font-weight:800}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#edf7f3;color:#087A5B;font-size:12px;font-weight:800}.pill.disabled{background:#fff0f0;color:#b42318}.hide{display:none}.msg{margin-top:12px;font-size:14px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.item{grid-template-columns:1fr}.head{display:none}input,select{width:100%}}
.productTabs{display:flex;gap:10px;margin:18px 0}.productTab{flex:1;background:#fff;color:#17332b;border:1px solid #d9e3de}.productTab.active{background:#087A5B;color:#fff}.productTab.gold.active{background:#76364d;border-color:#76364d}.productTab.gold:not(.active){color:#76364d}.productHeading{margin:4px 0 12px;font-size:18px;font-weight:800}@media(max-width:760px){.productTabs{flex-direction:row}.productTab{min-width:0;padding:12px 8px;font-size:12px}}#app[data-admin-product="GOLD"]{--gold-maroon:#713149;--gold-accent:#c7a367}#app[data-admin-product="GOLD"] .brand,#app[data-admin-product="GOLD"] .productHeading{color:#713149}#app[data-admin-product="GOLD"] .card{border-color:#e9dcd9}#app[data-admin-product="GOLD"] .stat{border-color:#e8d8d7;border-top:3px solid #c7a367}#app[data-admin-product="GOLD"] button:not(.secondary):not(.danger):not(.productTab){background:#713149;color:#fff8ed}#app[data-admin-product="GOLD"] button.secondary{background:#f8eeec;color:#713149}#app[data-admin-product="GOLD"] .pill{background:#f6eee2;color:#713149}#app[data-admin-product="GOLD"] .productTab.gold.active{background:#713149;color:#f4dba5;border-color:#c7a367}#app[data-admin-product="GOLD"] .productHeading:after{content:" ✦";color:#c7a367}</style></head><body><div class="wrap">
<section id="login" class="card login"><div class="brand">Planora Admin</div><p class="muted">Manage access, simply.</p>
<form id="loginForm"><input id="email" type="email" placeholder="Admin email" required style="width:100%;margin:8px 0"><input id="password" type="password" placeholder="Password" required style="width:100%;margin:8px 0"><button style="width:100%;margin-top:8px">Login</button></form><div id="loginMsg" class="msg"></div></section>
<section id="app" class="hide" data-admin-product="BUDGET"><div class="top"><div><div class="brand">Planora Admin</div><div class="muted">Access management</div></div><button class="secondary" id="logout">Logout</button></div>
<div class="productTabs"><button class="productTab active" type="button" data-product="BUDGET">Planora Budget</button><button class="productTab gold" type="button" data-product="GOLD">Planora Gold</button></div><div id="productHeading" class="productHeading">Planora Budget · Lisensi</div><div class="grid"><div class="stat"><div class="muted">Total codes</div><b id="sTotal">0</b></div><div class="stat"><div class="muted">Available</div><b id="sAvail">0</b></div><div class="stat"><div class="muted">Active</div><b id="sActive">0</b></div><div class="stat"><div class="muted">Disabled</div><b id="sDisabled">0</b></div></div>
<div class="card" style="margin-top:16px"><h3>Generate access code</h3><div class="row"><input id="customer" placeholder="Nama pembeli"><input id="order" placeholder="No. order Shopee"><select id="market"><option>Shopee</option><option>Manual</option><option>Other</option></select><button id="generate">Generate Code</button></div><div id="genMsg" class="msg"></div></div>
<div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between"><h3>Access codes</h3><button class="secondary" id="refresh">Refresh</button></div><div class="table"><div class="item head muted"><b>Customer / Order</b><b>Access Code</b><b>Status</b><b>Devices</b><b>Actions</b></div><div id="list"></div></div></div>
</section></div><script src="./config.js"></script><script>
const cfg=window.PLANORA_CONFIG||{}; let sb;let currentProduct='BUDGET';
const $=x=>document.getElementById(x);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function msg(id,t,bad=false){$(id).textContent=t;$(id).style.color=bad?'#b42318':'#087A5B'}
async function init(){if(!cfg.url||!cfg.key){msg('loginMsg','Configuration belum tersedia.',true);return} sb=supabase.createClient(cfg.url,cfg.key); const {data}=await sb.auth.getSession(); if(data.session) showApp(); else $('login').classList.remove('hide')}
$('loginForm').onsubmit=async e=>{e.preventDefault();msg('loginMsg','Signing in…');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg('loginMsg',error.message,true);showApp()}
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()}
async function showApp(){$('login').classList.add('hide');$('app').classList.remove('hide');await load()}
async function load(){if(currentProduct==='GOLD'){['sTotal','sAvail','sActive','sDisabled'].forEach(id=>$(id).textContent='—');$('list').innerHTML='<p class="muted">Kode Gold belum tersedia. Database perlu disiapkan terlebih dahulu agar lisensi Gold terpisah dan aman.</p>';return}const {data,error}=await sb.from('planora_licenses').select('id,access_code,customer_name,marketplace,marketplace_order_id,status,max_devices,created_at,planora_devices(id) ').order('created_at',{ascending:false});if(error){alert(error.message);return}const a=data||[];$('sTotal').textContent=a.length;$('sAvail').textContent=a.filter(x=>x.status==='available').length;$('sActive').textContent=a.filter(x=>x.status==='active').length;$('sDisabled').textContent=a.filter(x=>x.status==='disabled').length;$('list').innerHTML=a.map(x=>`<div class="item"><div><b>${esc(x.customer_name||'—')}</b><div class="muted">${esc(x.marketplace||'')} · ${esc(x.marketplace_order_id||'—')}</div></div><div class="code">${esc(x.access_code)}</div><div><span class="pill ${x.status==='disabled'?'disabled':''}">${esc(x.status)}</span></div><div>${(x.planora_devices||[]).length}/${x.max_devices}</div><div class="actions"><button class="secondary" onclick="copyCode('${esc(x.access_code)}')">Copy</button><button class="${x.status==='disabled'?'secondary':'danger'}" onclick="toggleLicense('${x.id}','${x.status}')">${x.status==='disabled'?'Enable':'Disable'}</button><button class="secondary" onclick="resetDevices('${x.id}')">Reset devices</button><button class="danger" title="Hapus pesanan" aria-label="Hapus pesanan" onclick="deleteOrder('${x.id}','${esc(x.customer_name||'pesanan ini')}')">×</button></div></div>`).join('')||'<p class="muted">Belum ada access code.</p>'}
$('generate').onclick=async()=>{const c=$('customer').value.trim(),o=$('order').value.trim();if(currentProduct==='GOLD')return msg('genMsg','Aktivasi Gold belum siap. Siapkan database lisensi Gold terlebih dahulu.',true);if(!c)return msg('genMsg','Isi nama pembeli dulu.',true);msg('genMsg','Generating…');const {data,error}=await sb.rpc('generate_planora_license',{p_product_code:currentProduct,p_customer_name:c,p_marketplace:$('market').value,p_order_id:o||null});if(error)return msg('genMsg',error.message,true);msg('genMsg','Created: '+data);$('customer').value='';$('order').value='';await load()}
document.querySelectorAll('[data-product]').forEach(btn=>btn.addEventListener('click',()=>{currentProduct=btn.dataset.product;$('app').dataset.adminProduct=currentProduct;$('generate').disabled=currentProduct==='GOLD';$('generate').title=currentProduct==='GOLD'?'Menunggu konfigurasi database Gold':'';document.querySelectorAll('[data-product]').forEach(b=>b.classList.toggle('active',b===btn));$('productHeading').textContent='Planora '+(currentProduct==='GOLD'?'Gold':'Budget')+' · Lisensi';msg('genMsg','');load()}));$('refresh').onclick=load;
window.copyCode=async c=>{await navigator.clipboard.writeText(c);alert('Access code copied.')}
window.toggleLicense=async(id,status)=>{const next=status==='disabled'?'active':'disabled';const {error}=await sb.from('planora_licenses').update({status:next}).eq('id',id);if(error)alert(error.message);else load()}
window.resetDevices=async id=>{if(!confirm('Reset semua perangkat untuk kode ini?'))return;const {error}=await sb.from('planora_devices').delete().eq('license_id',id);if(error)alert(error.message);else load()}
window.deleteOrder=async(id,name)=>{if(!confirm('Hapus pesanan '+name+'? Access code juga akan dihapus dan tidak bisa dipakai lagi.'))return;const {error}=await sb.from('planora_licenses').delete().eq('id',id);if(error)alert(error.message);else load()}
init();
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
